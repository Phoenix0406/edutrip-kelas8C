<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mandarin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #f9f2e7, #f4dfc5);
      overflow-x: hidden;
      color: #5b3c1d;
    }

    header {
      background: rgba(244, 228, 196, 0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 999;
      padding: 20px 0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    header a {
      color: #a8652d;
      text-decoration: none;
      margin: 0 18px;
      font-size: 18px;
      font-weight: bold;
      position: relative;
      transition: color 0.3s ease;
    }

    header a::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 2px;
  bottom: -5px;
  left: 0;
  background-color: #b84a39;
  transform: scaleX(0);
  transform-origin: right; /* THIS is the key */
  transition: transform 0.3s ease;
}

header a:hover::after {
  transform: scaleX(1); /* it scales from left to right now */
  transform-origin: left;
}


    h1 {
      text-align: center;
      margin-top: 60px;
      font-size: 48px;
      color: #b84a39;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.05);
      font-family: 'Georgia', serif;
      letter-spacing: 2px;
      animation: floatUpDown 4s ease-in-out infinite;
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
      margin: 30px auto;
      perspective: 1000px;
      animation: floatUpDown 5s ease-in-out infinite;
    }

    .homeimg {
      max-width: 92%;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(100, 50, 10, 0.15);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      transform: translateZ(0);
      border: 2px solid #e8c8a1;
    }

    .homeimg:hover {
      transform: scale(1.04);
      box-shadow: 0 30px 70px rgba(80, 30, 0, 0.25);
    }

    /* Float animation */
    @keyframes floatUpDown {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 32px;
      }

      header a {
        margin: 10px 10px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">Home</a>
    <a href="agama.html">Agama</a>
    <a href="pendidikanpancasila.html">Pendidikan Pancasila</a>
    <a href="bahasaindonesia.html">Bahasa Indonesia</a>
    <a href="english.html">English</a>
    <a href="ips.html">IPS</a>
    <a href="mandarin.html">Mandarin</a>
  </header>

  <h1>MANDARIN</h1>

  <div class="image-wrapper">
    <img src="PT Mandarin (1).png" alt="Mandarin Image" class="homeimg" />
  </div>
</body>
</html>
