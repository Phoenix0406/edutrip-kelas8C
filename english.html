<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bahasa Indonesia</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif;
      background: #f4f1ee;
      color: #1a1a1a;
      overflow-x: hidden;
    }

    header {
      background: #e6e2dd;
      padding: 20px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #ccc;
      font-family: 'Times New Roman', Times, serif;
    }

    header a {
      color: #2b2b2b;
      text-decoration: none;
      margin: 0 18px;
      font-size: 18px;
      font-weight: bold;
      position: relative;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    header a::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #000;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }

    header a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    h1 {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 60px;
      font-size: 48px;
      font-family: 'Times New Roman', Times, serif;
      letter-spacing: 2px;
      color: #111;
      padding-bottom: 10px;
      animation: fadeInTitle 1.5s ease;
    }

    @keyframes fadeInTitle {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px auto;
      padding: 30px 20px;
      border-top: 1px dashed #aaa;
      border-bottom: 1px dashed #aaa;
      max-width: 900px;
    }

    .homeimg {
      max-width: 100%;
      height: auto;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      animation: float 4s ease-in-out infinite;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .homeimg:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 34px;
      }

      header a {
        margin: 10px 10px;
        font-size: 16px;
      }

      .image-wrapper {
        padding: 20px 10px;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">Home</a>
    <a href="agama.html">Agama</a>
    <a href="pendidikanpancasila.html">Pendidikan Pancasila</a>
    <a href="bahasaindonesia.html">Bahasa Indonesia</a>
    <a href="english.html">English</a>
    <a href="ips.html">IPS</a>
    <a href="mandarin.html">Mandarin</a>
  </header>

  <h1>ENGLISH</h1>

  <div class="image-wrapper">
    <img src="1 copy.png" alt="Bahasa Indonesia Image" class="homeimg" />
  </div>
  <div class="image-wrapper">
    <img src="2 copy.png" alt="Bahasa Indonesia Image" class="homeimg" />
  </div>
</body>
</html>
